[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-podcast-ai"
version = "0.3.0"
description = "Turn any YouTube podcast, channel, playlist or media series into clean, timestamped markdown transcripts."
requires-python = ">=3.9"
dependencies = ["yt-dlp"]

[project.optional-dependencies]
whisper = ["faster-whisper"]
studio = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1"]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
legacy = "legacyai.cli:main"
legacy-studio = "legacyai.studio.manage:main"

[tool.setuptools.packages.find]
where = ["src"]
